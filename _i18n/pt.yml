big-gate-boy:
  meta-description: "Um experimento aberto de Game Boy em FPGA, construído em torno de um Lattice ECP5, uma CPU em Verilog e seis painéis de LED submetidos a engenharia reversa."
  lede: "Um experimento aberto em FPGA que reconstrói o Game Boy em lógica programável e mira em uma gloriosa tela gigante de seis painéis."
  hero-eyebrow: "Hardware aberto · FPGA · Verilog"
  hero-title: "Game Boy, reconstruído porta por porta."
  hero-description: "O Big Gate Boy explora uma CPU compatível com Game Boy em Verilog para um Lattice ECP5, tendo seis painéis de LED como tela gigante. O código, os testes, as lives e a engenharia reversa dos painéis estão reunidos aqui."
  source-button: "Explorar o código"
  playlist-button: "Assistir à construção"
  path-label: "Caminho do projeto Big Gate Boy"
  pipeline-cpu: "CPU e mapa de opcodes"
  pipeline-tests: "Testes em Assembly"
  pipeline-panels: "Engenharia reversa dos painéis"
  pipeline-display: "Meta: tela de seis painéis"
  explore-title: "Explore a construção"
  explore-description: "Comece pela camada que mais interessa: lógica do processador, hardware de vídeo incomum, sessões gravadas ou código-fonte."
  cpu-kicker: "Referência do processador"
  cpu-title: "CPU e mapa de instruções"
  cpu-description: "Consulte as convenções de opcode, grupos de registradores, operações da ALU e o mapa de instruções usados na implementação."
  cpu-link: "Abrir a referência de microcódigo"
  panels-kicker: "Hardware da tela"
  panels-title: "Pesquisa sobre os painéis LYD6168"
  panels-description: "Acompanhe a investigação que identificou os painéis LYD6168 sem documentação como hardware compatível com o MBI5153."
  panels-link: "Ler a investigação dos painéis"
  streams-kicker: "Construído em público"
  streams-title: "Sessões de desenvolvimento"
  streams-description: "Veja o projeto tomar forma nas lives gravadas, do trabalho na CPU aos experimentos com o hardware."
  streams-link: "Abrir a playlist no YouTube"
  source-kicker: "Código aberto"
  source-title: "Verilog, testes e ferramentas"
  source-description: "Explore os módulos da CPU, test benches da ALU e do banco de registradores, testes em Assembly, constraints e ferramentas de build."
  source-link: "Ver o repositório"
  resources-title: "Notas sobre os painéis"
  resources-description: "Referências práticas produzidas ao transformar seis painéis de LED desconhecidos em hardware utilizável no projeto."
  testing-title: "Identificar e testar o controlador"
  testing-description: "Um caminho passo a passo pelo software do fabricante e pelo processo de detecção do CI controlador."
  firmware-title: "Alterar o firmware FPGA da placa receptora"
  firmware-description: "Notas para carregar o firmware com suporte a S-PWM exigido por estes painéis."
  datasheet-title: "Datasheet do controlador MBI5153"
  datasheet-description: "A referência que tornou compreensível o comportamento do LYD6168."
  status-label: "Estado do projeto"
  status-description: "Este é um projeto realmente em andamento. As notas da CPU, o código, os testes e a pesquisa dos painéis estão publicados como existem; a documentação de temporização ainda incompleta não é apresentada como pronta."
goes-satellite-hunt:
  meta-description: "Um guia prático completo para receber o LRIT do GOES-13, do hardware de antena em banda L e da demodulação BPSK à decodificação CCSDS e à montagem de imagens meteorológicas."
  hero-eyebrow: "Guia de campo detalhado · GOES-13 · Publicado em 2017"
  hero-description: "Monte uma estação terrestre em banda L e acompanhe cada transformação, das amostras de radiofrequência aos produtos meteorológicos LRIT completos. O guia conecta hardware prático de RF, GNU Radio, codificação de canal, quadros CCSDS, transporte de pacotes e arquivos de imagem como um único sistema."
  motivation-button: "Comece pela motivação"
  open-project-button: "Abrir o Open Satellite Project"
  hero-image-alt: "Imagem infravermelha de disco completo da Terra, recuperada da transmissão LRIT do GOES-13"
  pipeline-label: "Caminho de processamento de sinais abordado neste guia"
  pipeline-receive: "Receber o sinal em banda L"
  pipeline-symbols: "Recuperar os símbolos BPSK"
  pipeline-frames: "Decodificar os quadros CCSDS"
  pipeline-channels: "Extrair os canais virtuais"
  pipeline-products: "Montar os produtos LRIT"
  story-title: "Do sinal à imagem"
  story-description: "Um registro prático da investigação, organizado como um guia técnico reutilizável."
  origin: "Este trabalho começou como uma série de cinco posts, escrita enquanto eu fazia a engenharia reversa do downlink do GOES-13 no fim de 2016. Reorganizei o material aqui para explicar toda a cadeia de recepção de forma coerente e mantê-lo útil junto à pesquisa do GOES-16 que veio depois."
  impact-prefix: "A investigação levou diretamente ao"
  impact-suffix: "Muitas das mesmas ideias também se aplicam a satélites meteorológicos com protocolos de downlink relacionados, incluindo a família Meteosat."
  chapters-title: "Capítulos"
  chapters-description: "Leia em ordem para acompanhar o pipeline completo ou vá direto à camada que está implementando."
  chapters-label: "Capítulos do GOES Satellite Hunt"
  context-kicker: "Contexto"
  motivation-title: "Motivação"
  motivation-description: "Por que receber o GOES diretamente, o que o projeto buscou demonstrar e como o sistema completo se encaixa."
  motivation-link: "Começar o guia"
  hardware-kicker: "Hardware de RF"
  hardware-title: "Montagem do hardware"
  hardware-description: "Monte a parabólica, construa um alimentador cilíndrico em guia de onda, adicione filtragem e amplificação e aponte a antena."
  hardware-link: "Montar o receptor"
  demodulator-kicker: "Processamento de sinais"
  demodulator-title: "O demodulador"
  demodulator-description: "Mova o espectro gravado para a banda-base, filtre e reamostre, recupere portadora e relógio e produza símbolos BPSK."
  demodulator-link: "Recuperar os símbolos"
  frame-kicker: "Codificação de canal"
  frame-title: "Decodificador de quadros"
  frame-description: "Encontre o marcador de sincronização, resolva a ambiguidade de fase, aplique a decodificação de Viterbi e recupere quadros CCSDS de tamanho fixo."
  frame-link: "Decodificar os quadros"
  packets-kicker: "Transporte"
  packets-title: "Demultiplexador de pacotes"
  packets-description: "Desembaralhe o fluxo, corrija erros Reed–Solomon, separe canais virtuais e reconstrua pacotes espaciais."
  packets-link: "Extrair os pacotes"
  files-kicker: "Produtos"
  files-title: "Arquivos e formatos LRIT"
  files-description: "Processe cabeçalhos LRIT, descomprima imagens codificadas em Rice, nomeie os produtos e interprete o catálogo completo de arquivos."
  files-link: "Montar os arquivos"
  file-reference-button: "Consultar a referência de arquivos LRIT"
  conclusion-button: "Ler a conclusão"
  license-prefix: "Este guia é publicado sob a"
  license-name: "licença Creative Commons Atribuição-CompartilhaIgual"
  license-suffix: "correções são bem-vindas."
  thanks-prefix: "Agradeço à"
  thanks-community: "comunidade no StarChat por me ajudar a aprender SDR de satélites, especialmente"
  thanks-and: "e"
  thanks-family: "e à minha família pelo apoio a um telhado cheio de parabólicas e antenas."
  open-project-name: "Open Satellite Project"
  meteosat-name: "Meteosat"

tesla-coils:
  meta-description: "Um arquivo visual dos projetos de bobinas de Tesla SSTC, DRSSTC e com centelhador de Lucas Teske, incluindo arcos musicais, controle por FPGA, notas técnicas, fotos e gravações."
  hero-eyebrow: "Alta tensão · potência ressonante · 2011–2012"
  hero-title: "Potência ressonante, faíscas controladas por FPGA e um pouco de música."
  hero-description: "Um arquivo da oficina com SSTCs, DRSSTCs, interruptores musicais, circuitos experimentais de realimentação e toda a evolução da ZARC—de um protótipo de 600 W a uma máquina controlada por FPGA com quatro canais."
  hero-image-alt: "Arcos elétricos roxos se ramificando a partir da DRSSTC ZARC em uma oficina escura"
  hero-image-caption: "DRSSTC ZARC em funcionamento"
  milestones-button: "Explorar as construções principais"
  experiments-button: "Ver os experimentos de bancada"
  builds-label: "construções documentadas"
  recordings-label: "gravações"
  period-label: "período do arquivo"
  archive-label: "Diário da oficina"
  archive-title: "Um arquivo de faíscas, falhas e hardware funcional"
  archive-description: "Estas são as construções que sobreviveram o suficiente para serem documentadas. Juntas, registram experimentos com componentes de chaveamento, realimentação, sintonia, modulação de áudio, construção mecânica e controle por FPGA."
  date-note: "As datas são dos envios dos vídeos, não necessariamente das construções. Normalmente houve pouco tempo entre a gravação e o envio."
  milestones-title: "Construções principais"
  milestones-description: "Os maiores marcos, da bobina portátil ZINC à estrutura final da ZARC, sua sintonia, o controlador MIDI e os primeiros testes com o corpo completo."
  experiments-title: "Experimentos de bancada"
  experiments-description: "Bobinas menores e testes de topologia que alimentaram as construções principais: SSTCs de onda contínua, primeiras DRSSTCs, modulação de áudio e uma bobina com centelhador alimentada por flyback."
  watch-recording: "Assistir à gravação"
  technical-highlights: "Destaques técnicos"
  photos-label: "Fotografias da construção"
  safety-label: "Arquivo de alta tensão"
  safety-description: "Estas são notas históricas de projetos, não instruções de montagem. Bobinas de Tesla envolvem tensões letais e energia armazenada; reproduzir este trabalho exige conhecimento adequado de engenharia de alta tensão e controles de segurança."

