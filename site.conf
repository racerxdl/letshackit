map $request_uri $homepage_discovery_links {
  default "";
  ~^/(?:index\.html)?(?:\?.*)?$ '</api/search/openapi.json>; rel="service-desc"; type="application/json", </api/search/>; rel="service-doc"; type="text/html", </sitemap_index.xml>; rel="describedby"; type="text/xml"';
}

map $http_accept $markdown_requested {
  default 0;
  ~*text/markdown 1;
}

map $uri $markdown_alternate_link {
  default "";
  ~^/+(?<markdown_page>.+)\.html$ '</$markdown_page.md>; rel="alternate"; type="text/markdown"';
}

map $uri $html_markdown_uri {
  default /__missing_markdown__;
  ~^(?<html_markdown_page>.*)\.html$ $html_markdown_page.md;
}

server {
  listen          80;
  root            /var/www;
  index           index.html;
  charset         utf-8;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
  add_header Link $homepage_discovery_links always;
  add_header Link $markdown_alternate_link always;
  add_header Vary Accept always;
  underscores_in_headers on;

  # Rewrite ending slash to not ending slash

  location /health-check {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }

  location = /.well-known/api-catalog {
    default_type application/linkset+json;
    try_files $uri =404;
  }

  if (!-d $request_filename) {
      rewrite ^/(.*)/$ /$1 permanent;
  }

  error_page 404 /404.html;
  error_page 418 = @markdown;
  location  /404.html {
    internal;
    root /var/www;
  }

  location @error {}

  location @html {
    try_files $uri.html $uri $uri/ @error;
  }

  location @markdown {
    default_type text/markdown;
    charset_types text/markdown;
    try_files $uri.md $uri/index.md $html_markdown_uri @html;
  }

  location ~ \.md$ {
    default_type text/markdown;
    charset_types text/markdown;
    try_files $uri =404;
  }

  location / {
    if ($markdown_requested) {
      return 418;
    }
    try_files $uri.html $uri $uri/ @error;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires 30d;
    add_header Pragma public;
    add_header Cache-Control "public";
  }
}