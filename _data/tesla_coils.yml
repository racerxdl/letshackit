  - id: zinc-sstc
    title:
      en: ZINC SSTC
      pt: ZINC SSTC
    subtitle:
      en: Audio-modulated portable coil
      pt: Bobina portátil com modulação de áudio
    date: 2012-08-27
    date_label:
      en: August 27, 2012
      pt: 27 de agosto de 2012
    kind: SSTC
    featured: true
    description:
      en: The last Tesla coil I built was a compact SSTC driven by two IRFP250N MOSFETs and a protoboard GDT driver. I designed it to travel, so I could demonstrate musical arcs away from the workshop using ZARC's audio interrupter.
      pt: A última bobina de Tesla que construí foi uma SSTC compacta, controlada por dois MOSFETs IRFP250N e um driver de GDT em protoboard. Eu a projetei para viajar e demonstrar arcos musicais fora da oficina usando o interruptor de áudio da ZARC.
    tags:
      - SSTC
      - 2 × IRFP250N
      - Audio
    videos:
      - id: vFWoArNIBew
        label:
          en: ZINC demonstration
          pt: Demonstração da ZINC

  - id: driverless-sstc
    title:
      en: Driverless SSTC
      pt: SSTC sem Driver
    subtitle:
      en: Direct current-transformer feedback
      pt: Realimentação direta por transformador de corrente
    date: 2011-11-23
    date_label:
      en: November 23, 2011
      pt: 23 de novembro de 2011
    kind: SSTC
    featured: true
    description:
      en: An experimental half-wave, driverless SSTC of my own design. A current transformer on the secondary feeds the MOSFET gates directly. I never optimized the circuit, but the feedback scheme worked.
      pt: Uma SSTC experimental de meia onda e sem driver, baseada em um circuito que eu projetei. Um transformador de corrente no secundário alimenta diretamente os gates dos MOSFETs. Nunca otimizei o circuito, mas a realimentação funcionou.
    tags:
      - Driverless
      - Half-wave
      - CT feedback
    videos:
      - id: poqmtvrZDk0
        label:
          en: Driverless SSTC test
          pt: Teste da SSTC sem driver
    photos:
      - href: https://i.imgur.com/Th0JOug.png
        src: https://i.imgur.com/Th0JOug.png
        alt:
          en: Driverless SSTC circuit diagram
          pt: Diagrama do circuito da SSTC sem driver

  - id: zarc-fpga-midi
    title:
      en: ZARC with FPGA MIDI Interrupter
      pt: ZARC com Interruptor MIDI em FPGA
    subtitle:
      en: Four channels on 220 VAC mains
      pt: Quatro canais em rede de 220 VAC
    date: 2011-09-16
    date_label:
      en: September 16, 2011
      pt: 16 de setembro de 2011
    kind: DRSSTC
    featured: true
    description:
      en: ZARC's final configuration paired a four-channel polyphonic FPGA MIDI interrupter with the controller in the coil's base. The limiter was set to 400 A; after detuning the coil slightly, measured primary current stayed below 320 A.
      pt: A configuração final da ZARC combinava um interruptor MIDI polifônico de quatro canais em FPGA com o controlador na base da bobina. O limite era de 400 A; após dessintonizar um pouco a bobina, a corrente medida no primário ficou abaixo de 320 A.
    tags:
      - DRSSTC
      - FPGA MIDI
      - 320 A peak
    videos:
      - id: gAdmvSDJwfU
        label:
          en: FPGA MIDI performance
          pt: Apresentação com MIDI em FPGA
      - id: BHmwMWUPKDc
        label:
          en: Variac failure
          pt: Falha do Variac

  - id: zarc-tuned-base
    title:
      en: ZARC — Tuned Base
      pt: ZARC — Base Sintonizada
    subtitle:
      en: The final 1 kW mechanical build
      pt: A montagem mecânica final de 1 kW
    date: 2011-04-06
    date_label:
      en: April 6, 2011
      pt: 6 de abril de 2011
    kind: DRSSTC
    featured: true
    description:
      en: I rebuilt ZARC's base and refined the tuning into what became the final hardware setup—about 1 kW input, doubled 110 VAC for roughly 320 VDC on the bus, and 300 A peak through an IRG4PC50UD full bridge. It remains one of my favorite electrical engineering projects.
      pt: Refiz a base da ZARC e refinei a sintonia até chegar à configuração final—cerca de 1 kW de entrada, 110 VAC dobrados para aproximadamente 320 VDC no barramento e pico de 300 A em uma ponte completa com IRG4PC50UD. Continua sendo um dos meus projetos favoritos de engenharia elétrica.
    tags:
      - DRSSTC
      - 1 kW
      - 300 A peak
    videos:
      - id: 8PSwmFOdTWc
        label:
          en: Tuned-base test 1
          pt: Teste 1 da base sintonizada
      - id: M4n_VW-3P9c
        label:
          en: Tuned-base test 2
          pt: Teste 2 da base sintonizada
